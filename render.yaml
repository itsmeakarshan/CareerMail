services:
  # CareerMail Python FastAPI Web API Backend
  - type: web
    name: careermail-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careermail-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://careermail.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  # CareerMail Managed PostgreSQL Database
  - name: careermail-db
    databaseName: careermail
    user: careermail
    plan: free
    region: oregon
