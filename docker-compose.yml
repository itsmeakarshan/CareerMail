services:
  postgres:
    image: postgres:16-alpine
    container_name: careermail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careermail
      POSTGRES_USER: careermail
      POSTGRES_PASSWORD: careermail123
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careermail -d careermail"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careermail-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careermail
      SPRING_DATASOURCE_USERNAME: careermail
      SPRING_DATASOURCE_PASSWORD: careermail123
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careermail-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  postgres_data:
