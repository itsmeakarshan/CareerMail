services:
  postgres:
    image: postgres:16-alpine
    container_name: careermail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-careermail}
      POSTGRES_USER: ${DB_USER:-careermail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-careermail123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-careermail} -d ${DB_NAME:-careermail}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careermail-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-careermail}
      DB_USER: ${DB_USER:-careermail}
      DB_PASSWORD: ${DB_PASSWORD:-careermail123}
      DATABASE_URL: Host=postgres;Port=5432;Database=${DB_NAME:-careermail};Username=${DB_USER:-careermail};Password=${DB_PASSWORD:-careermail123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careermail-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  postgres_data:
